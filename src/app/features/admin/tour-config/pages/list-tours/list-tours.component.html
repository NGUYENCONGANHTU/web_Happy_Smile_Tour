<div class="flex gap-2 justify-end !mb-2">
  <app-header-input-search></app-header-input-search>
  <button nz-button (click)="goTo(BaseFormMode.CREATE)">
    <nz-icon nzType="plus" />
    Thêm mới

<app-table-base-component
  [data]="data"
