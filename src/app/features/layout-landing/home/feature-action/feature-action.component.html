<swiper-container loop="true"
                    slides-per-view="1"
                    space-between="15"
                    breakpoints='{
                      "640": { "slidesPerView": 1 },
                      "768": { "slidesPerView": 2 },
                      "1024": { "slidesPerView": 3 },
                      "1280": { "slidesPerView": 4 }
                    }'
                    >
  @for (data of dataFeatureTour; track $index) {

    <swiper-slide class="slide">
      <div class="tour-card">
        <div class="ribbon">Giá tốt nhất {{$index + 1}}</div>
        <img
          src="https://igotravel.vn/wwwroot/resources/upload/tong-hop-cac-hinh-thuc-du-lich-pho-bien-nhat-tai-viet-nam.png"
          alt="Tour" class="tour-image"/>

        <div class="tour-content">
          <div class="tour-title">
            {{data.title}}
          </div>

          <div class="rating">
            <span class="score">{{data.star}}</span>
            <span class="reviews">| {{data.numberComment}} đánh giá</span>
          </div>

          <ul class="tour-points">
            @for ( item of  data.destination; track $index) {
              <li>{{item}}</li>
            }
          </ul>

          <div class="price">
            <span class="old-price">{{data.originalPrice.toLocaleString()}}₫</span>
            <span class="new-price">{{data.finalPrice.toLocaleString()}} ₫</span>
          </div>
        </div>
      </div>
    </swiper-slide>
  }
