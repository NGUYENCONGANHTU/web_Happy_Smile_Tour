<nz-timeline>
  @for (day of tourDays; track day; let i = $index) {
    <nz-timeline-item>
      <nz-collapse>
        <nz-collapse-panel
          [nzHeader]="
            ('day' | trans: 'tab_tour_detail') +
            ' ' +
            (i + 1) +
            ': ' +
            day.title
          "
          [nzActive]="false">
          <div
            class="text-justify"
            [innerHTML]="day?.description | safeHtml"></div>
        </nz-collapse-panel>
      </nz-collapse>
    </nz-timeline-item>
  }
</nz-timeline>
