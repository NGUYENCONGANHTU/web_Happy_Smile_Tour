<nz-timeline>
  <nz-timeline-item
    *ngFor="let day of tourDays; let i = index"
  >
    <nz-collapse>
      <nz-collapse-panel
        [nzHeader]="'NGÀY ' + (i + 1) + ': ' + day.title + ' (' + day.meal + ')'"
        [nzActive]="false"
      >
        <div>{{ day.detail }}</div>
      </nz-collapse-panel>
    </nz-collapse>
  </nz-timeline-item>
</nz-timeline>
