<nz-carousel nzAutoPlay [nzDots]="true" nzEffect="fade" [nzEnableSwipe]="true">
  @if (listImageBanner) {
    @for (data of listImageBanner.images; track data.id) {
      <div nz-carousel-content>
        <img
          [src]="formatImage(data.storagePath)"
          alt=""
          class="w-full h-full object-cover" />
      </div>
    }
  }
</nz-carousel>
