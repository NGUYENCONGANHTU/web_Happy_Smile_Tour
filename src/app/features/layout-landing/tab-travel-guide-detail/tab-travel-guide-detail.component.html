<section class="tab-trave-tour-detail">
  @if (dataContentTravelGuide) {
    <!--    Điều hướng -->
    <nz-breadcrumb nzSeparator=">" class="breadcrumb">
      <nz-breadcrumb-item>
        <a routerLink="/">{{ 'home' | trans: 'tab_travel_detail' }}</a>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item
        class="font-medium"
        [innerHTML]="dataContentTravelGuide?.title | safeHtml">
      </nz-breadcrumb-item>
    </nz-breadcrumb>
    <!-- Tiêu đề bài viết -->
    <div class="trave-tour-detail space-y-5!">
      <div
        class="trave-tour-detail-title"
        [innerHTML]="dataContentTravelGuide?.title | safeHtml"></div>
      <!-- Thời gian bài viết -->
      <div class="mt-3!">
        <fa-icon [icon]="faClock" class="mr-2!"></fa-icon>
        <span class="italic">
          {{ dataContentTravelGuide.modifiedDate | dateTimeFormat }}
        </span>
      </div>
      <!-- Nội dung bài viết -->
      <div
        class="trave-tour-detail-content"
        [innerHTML]="dataContentTravelGuide?.content | safeHtml"></div>
    </div>
  }
</section>
