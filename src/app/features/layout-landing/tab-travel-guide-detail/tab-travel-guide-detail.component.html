<section class="tab-trave-tour-detail">
  @if (dataContentTravelGuide) {
    <nz-breadcrumb nzSeparator=">" class="breadcrumb">
      <nz-breadcrumb-item>
        <a routerLink="/">{{ 'home' | trans: 'tab_travel_detail' }}</a>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item
        class="font-medium"
        [innerHTML]="dataContentTravelGuide.title">
      </nz-breadcrumb-item>
    </nz-breadcrumb>

    <div class="trave-tour-detail space-y-5!">
      <div
        class="trave-tour-detail-title"
        [innerHTML]="dataContentTravelGuide.title"></div>
      <div class="mt-3!">
        <fa-icon [icon]="faClock" class="mr-2!"></fa-icon>
        <span class="italic">
          {{ dataContentTravelGuide.modifiedDate | dateTimeFormat }}
        </span>
      </div>
      <div
        class="trave-tour-detail-content"
        [innerHTML]="dataContentTravelGuide.content"></div>
    </div>
  }
</section>
