<nz-timeline>
  @for (day of tourDays; track $index) {
    <nz-timeline-item>
      <nz-collapse>
        <nz-collapse-panel
          [nzHeader]="'NGÀY ' + ($index + 1) + ': ' + day.title"
          [nzActive]="false">
          <div>{{ day.description }}</div>
        </nz-collapse-panel>
      </nz-collapse>
    </nz-timeline-item>
  }
</nz-timeline>
